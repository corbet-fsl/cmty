[package]
name = "cmty"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Community facade of cvld: membership, gatekeeping and policy per community"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cmty"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs", branch = "main" }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main" }
cmbr = { git = "https://git.corbet.ch/corbet-libs/cmbr", branch = "main" }
cgts = { git = "https://git.corbet.ch/corbet-libs/cgts", branch = "main" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
cplc = { git = "https://git.corbet.ch/corbet-libs/cplc", branch = "main" }
tokio = { version = "1", features = ["sync", "time"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false }
data-encoding = "2.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
cgbl = { git = "https://git.corbet.ch/corbet-libs/cgbl.git", branch = "main" }
cnrl = { git = "https://git.corbet.ch/corbet-foss/cnrl", branch = "main" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main" }
ed25519-dalek = "2.2"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
rand = { version = "0.8", features = ["std_rng"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", features = ["signer"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

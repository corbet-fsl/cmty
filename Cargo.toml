[package]
name = "cmty"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Community facade of cvld: membership, gatekeeping and policy per community"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cmty.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs.git", branch = "v01" }
clbs = { git = "https://git.corbet.ch/corbet-foss/clbs.git", branch = "v01" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns.git", branch = "v01" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh.git", branch = "v01" }
cmbr = { git = "https://git.corbet.ch/corbet-libs/cmbr.git", branch = "v01" }
cgts = { git = "https://git.corbet.ch/corbet-libs/cgts.git", branch = "v01" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
cplc = { git = "https://git.corbet.ch/corbet-libs/cplc.git", branch = "v01" }
tokio = { version = "1", features = ["sync", "time"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01" }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd.git", branch = "v01" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk.git", branch = "v01" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
cgbl = { git = "https://git.corbet.ch/corbet-libs/cgbl.git", branch = "v01" }
cnrl = { git = "https://git.corbet.ch/corbet-foss/cnrl.git", branch = "v01" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd.git", branch = "v01" }
ed25519-dalek = "2.2"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
rand = { version = "0.8", features = ["std_rng"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", features = ["signer", "volatile-signer"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
